version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: farmuser
      POSTGRES_PASSWORD: farmpassword
      POSTGRES_DB: farmdb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmuser -d farmdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  farmer-frontend:
    build:
      context: ./frontend/farmer_end
    ports:
      - "8081:80"
    restart: always

  vet-frontend:
    build:
      context: ./frontend/VetEnd
    ports:
      - "8082:80"
    restart: always

  admin-frontend:
    build:
      context: ./frontend/AdminEnd
    ports:
      - "8083:80"
    restart: always

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/farmdb
      - SPRING_DATASOURCE_USERNAME=farmuser
      - SPRING_DATASOURCE_PASSWORD=farmpassword
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_REDIS_HOST=redis
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@farm.ro
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

  # ── Monitoring & Observability ────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=1d'
    restart: always
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - prometheus

  # ── Automated Database Backups ────────────────────────────────
  db-backup:
    build:
      context: ./backup
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=farmuser
      - POSTGRES_PASSWORD=farmpassword
      - POSTGRES_DB=farmdb
    volumes:
      - ./backups:/backups
    restart: always
    depends_on:
      db:
        condition: service_healthy

  # ── TLS/SSL Reverse Proxy ────────────────────────────────────
  nginx:
    build:
      context: ./nginx
    ports:
      - "443:443"
      - "80:80"
    restart: always
    depends_on:
      - backend
      - farmer-frontend
      - vet-frontend
      - admin-frontend

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
