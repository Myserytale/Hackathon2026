worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS — re-resolve service names when containers restart
    resolver 127.0.0.11 valid=10s ipv6=off;

    # HTTP server (No SSL, Caddy handles HTTPS)
    server {
        listen 80;
        server_name localhost farm.local;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Landing Page
        location = / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location = /index.html {
            root /usr/share/nginx/html;
        }

        # Farmer Portal
        location /farmer/ {
            set $farmer_upstream farmer-frontend:80;
            rewrite ^/farmer/?(.*)$ /$1 break;
            proxy_pass http://$farmer_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Vet Portal
        location /vet/ {
            set $vet_upstream vet-frontend:80;
            rewrite ^/vet/?(.*)$ /$1 break;
            proxy_pass http://$vet_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Admin Portal
        location /admin/ {
            set $admin_upstream admin-frontend:80;
            rewrite ^/admin/?(.*)$ /$1 break;
            proxy_pass http://$admin_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Mailpit Portal (2FA Emails)
        location /mail/ {
            set $mail_upstream mailpit:8025;
            proxy_pass http://$mail_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # WebSocket support for Mailpit UI live updates
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Proxy to Spring Boot backend
        location /api/ {
            set $backend_upstream backend:8080;
            rewrite ^/api/?(.*)$ /api/$1 break;
            proxy_pass http://$backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;

            # WebSocket support (if needed)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
