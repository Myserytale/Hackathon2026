spring.application.name=farm
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/farmdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:farmuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:farmpassword}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
server.port=8080
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=6379

# --- Actuator & Prometheus Metrics ---
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# --- Email / SMTP (Docker default: Mailpit at localhost:1025, UI at :8025) ---
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:false}
app.mail.from=${MAIL_FROM:ROeID <noreply@roeid.ro>}
