spring.cache.type=none
app.data-seeder.enabled=false
app.database-schema-fixer.enabled=false

# Use H2 in-memory database so tests don't need a running PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Allow the test's NoOpCacheManager bean to override the real RedisCacheManager
spring.main.allow-bean-definition-overriding=true
